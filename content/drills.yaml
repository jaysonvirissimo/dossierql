# The training range. Each drill teaches one skill and is passed by any
# transmission whose response holds the facts under `expects`.

- id: one-field
  title: Ask for a field
  task: >
    The records clerk hands you a request form that is already filled in.
    The form is a query. Read it from the outside in. The word `query` and
    the outer braces hold the whole request. `country(name: "Portugal")`
    asks for one record, and the part in parentheses says which record: the
    country whose name is Portugal. The inner braces hold the fields you
    want from that record. At present they hold one field, `name`, and the
    archive returns that field and nothing more. Put a space or a new line
    between two fields, and no comma. One field to a line is easiest to
    read. Add a second field: ask for the country's `capital` as well.
  starter: |
    query {
      country(name: "Portugal") {
        name
      }
    }
  expects:
    - entity: Country:PT
      field: capital
      equals: Lisbon
  reference: |
    query {
      country(name: "Portugal") {
        name
        capital
      }
    }
  nudge: >
    Add the word `capital` on a line of its own, under `name`.
  payoff: >
    The clerk nods. The response has the same shape as your query: two
    fields asked for, two fields returned. Every query works like this.

- id: open-a-record
  title: Open a record
  task: >
    A city's `country` field does not hold a single value such as a word
    or a number. It holds another record, the country, which has fields of
    its own. To read one of those fields, write braces after `country` and
    put the field you want inside them. Find the name of the country that
    Lisbon is in.
  starter: |
    query {
      city(name: "Lisbon") {
        name
      }
    }
  expects:
    - entity: City:lisbon
      field: country
      equals: Country:PT
    - entity: Country:PT
      field: name
      equals: Portugal
  reference: |
    query {
      city(name: "Lisbon") {
        name
        country {
          name
        }
      }
    }
  nudge: >
    After `country`, write braces with the field you want inside them:
    `country { name }`.
  payoff: >
    Braces open a record. A field that holds a record is a link to that
    record, and wherever there is a link, you can open it.

- id: lists
  title: Read a list
  task: >
    Some fields hold a list of records instead of just one. A country's
    `borders` is one: it holds every country that shares a land border with
    it. You open a list with braces, the way you opened `country` in the
    last drill. The fields you put inside the braces come back once for
    each record in the list. Find the name of each country that borders
    Kenya.
  starter: |
    query {
      country(name: "Kenya") {
        name
      }
    }
  expects:
    - entity: Country:KE
      field: borders
      includes: Country:TZ
    - entity: Country:TZ
      field: name
      equals: Tanzania
  reference: |
    query {
      country(name: "Kenya") {
        name
        borders {
          name
        }
      }
    }
  nudge: >
    Add `borders { name }` inside the braces after `country(name: "Kenya")`.
  payoff: >
    Kenya has five land borders, and the response lists five countries. You
    asked for `name` once, inside the braces after `borders`, and the
    archive returned a `name` for each country in the list. In the raw
    response, a list comes back inside square brackets. The documentation
    shows which fields hold a list.

- id: two-links
  title: Follow two links
  task: >
    A field that holds a record, or a list of records, is a link from one
    record to another. A record that you have opened can have links of its
    own, and you can open those too. The query below opens the `country`
    field of the city of Prague, and that country is Czechia. Czechia has a
    `borders` list. Starting from the city of Prague, find the capital of
    each country that borders Czechia.
  starter: |
    query {
      city(name: "Prague") {
        country {
          name
        }
      }
    }
  expects:
    - entity: City:prague
      field: country
      equals: Country:CZ
    - entity: Country:CZ
      field: borders
      includes: Country:AT
    - entity: Country:AT
      field: capital
      equals: Vienna
  reference: |
    query {
      city(name: "Prague") {
        country {
          name
          borders {
            name
            capital
          }
        }
      }
    }
  nudge: >
    Inside the braces after `country`, add `borders { }`. Then ask for
    `capital` inside the braces after `borders`.
  payoff: >
    One request went from a city, to its country, to that country's
    neighbours. Each neighbour came back with its own capital.

- id: three-links
  title: Follow a chain of three links
  task: >
    The query below starts at the city of Lisbon, opens its `country`, which
    is Portugal, and opens Portugal's `borders`. Portugal has one land
    border, with Spain. The braces after `borders` hold the fields you want
    from each neighbour, so here they hold the fields for Spain. Spain is a
    country too, so it has a `borders` list of its own. You open Spain's
    list by writing another `borders` with braces inside those braces, under
    `name`. That makes a chain of three links: from the city to its country,
    from the country to its neighbour, and from the neighbour to its
    neighbours. Starting from the city of Lisbon, find the name of each
    country that borders Spain.
  starter: |
    query {
      city(name: "Lisbon") {
        country {
          name
          borders {
            name
          }
        }
      }
    }
  expects:
    - entity: City:lisbon
      field: country
      equals: Country:PT
    - entity: Country:PT
      field: borders
      includes: Country:ES
    - entity: Country:ES
      field: borders
      includes: Country:FR
    - entity: Country:FR
      field: name
      equals: France
  reference: |
    query {
      city(name: "Lisbon") {
        country {
          name
          borders {
            name
            borders {
              name
            }
          }
        }
      }
    }
  nudge: >
    The inner `borders { name }` lists Spain. Inside those braces, under
    `name`, add another `borders { name }` for the countries that border
    Spain.
  payoff: >
    Portugal is in the last list, because a border runs both ways: Portugal
    borders Spain, and Spain borders Portugal. Morocco is there because two
    Spanish cities, Ceuta and Melilla, are on the African coast. A query can follow as many
    links as the question needs, one pair of braces for each link.

- id: documentation
  title: Consult the documentation
  task: >
    The documentation below lists every kind of record and the fields each
    one has. Use the documentation to find the name of the currency used
    in the country where Luanda is.
  starter: |
    query {
      city(name: "Luanda") {
        name
      }
    }
  expects:
    - entity: City:luanda
      field: country
      equals: Country:AO
    - entity: Country:AO
      field: currency
      equals: Currency:AOA
    - entity: Currency:AOA
      field: name
      equals: Angolan kwanza
  reference: |
    query {
      city(name: "Luanda") {
        name
        country {
          currency {
            name
          }
        }
      }
    }
  nudge: >
    In the documentation, open City to see which field links a city to its
    country. Then open Country to find the field that links a country to
    its currency. Each link you follow is one more pair of braces in the
    query.
  payoff: >
    The kwanza is named after a river. The clerk stamps your induction
    form and slides a case file across the desk: tiles missing from a
    museum in Lisbon, and a crate that may be bound for Luanda.
