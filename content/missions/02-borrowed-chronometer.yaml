id: borrowed-chronometer
title: The Borrowed Chronometer
campaign: shadow-network
order: 2
clearance: 1
kind: assessment
teaches: null
practises: [nested-selections]
requires: [nested-selections]
summary: >
  An observatory's chronometer left Genoa among four crates. The buyer is
  particular about the currency.
motif: dial
clock:
  countdown: Buyer's steamer sails in {remaining}
  expired: The buyer's steamer has sailed
  onExpiry: end
startingStage: genoa

debrief:
  onTime: |
    Dakar customs opens the crate and finds the chronometer still
    ticking. The observatory sends its thanks and a bill for winding.
  stampOnTime: RECOVERED
  comparison: >
    The reference solution opens each shipment's destination, then that
    city's country, then that country's currency, all in one request. This
    time the editor started blank, and no part of the query was written
    for you.
  geography: >
    Senegal and Côte d'Ivoire use the West African CFA franc. Cameroon
    uses the Central African CFA franc, a separate currency with its own
    code.

stages:
  genoa:
    location: IT
    introduces: clock
    objective: Identify the shipment carrying the chronometer and the country receiving it.

    briefing: |
      A marine chronometer on loan to a Genoa observatory was not
      returned. Four shipments left Genoa under the same broker's
      seal. The buyer has cabled instructions about payment, and
      the bureaucracy would like the crate identified before the
      steamer sails.

      This is the first case with a clock. The clock counts hours
      in the story, not real time. Each query you transmit costs
      one hour, however much the query asks for. A request that
      the records clerk returns unread costs nothing. The section
      below gives the deadline and the other prices.

      The terminal starts with an empty editor. To check how a query
      begins, open Documentation and read the Query entry.

    clues:
      - text: >
          All four shipments left Genoa.
        constraint:
          $shipment.origin: City:genoa
      - text: >
          The observatory lists a marine chronometer, brass, gimballed.
        constraint:
          $shipment.manifest: Marine chronometer, brass, gimballed
      - text: >
          The buyer's cable insists on payment in the currency of the
          country where the crate lands: the West African CFA franc.
        constraint:
          $shipment.destination.country.currency: Currency:XOF
          $shipment.destination.country: $country

    scaffold:
      level: none

    hints:
      nudge: >
        Two crates fit the observatory's description. Which of the two
        lands in a country that uses the buyer's currency?
      concept: >
        Start from the city the shipments left, which is Genoa. Each
        field that holds a record needs braces after it, with the fields
        you want inside. Keep opening records until you reach the
        currency: shipment, then destination, then country, then currency.
      schema: >
        Look at City.departingShipments, Shipment.destination,
        City.country, and Country.currency.
      skeleton: |
        city(name: "Genoa") {
          departingShipments { id manifest destination { name country { name currency { name } } } }
        }

    solution:
      type: deduction
      shipment: GEN-0211
      country: SN
    labels:
      shipment: Shipment
      country: Receiving country

    claims:
      - id: contents
        prompt: The shipment matches the observatory's description.
        evidenceSets:
          - facts:
              - entity: Shipment:$shipment
                field: manifest
                equals: Marine chronometer, brass, gimballed
          - facts:
              - entity: Shipment:$shipment
                field: inspection
                equals: Inspection:$inspection
              - entity: Inspection:$inspection
                field: finding
                equals: Brass timekeeper in a gimbal mount
      - id: currency
        prompt: The receiving country uses the West African CFA franc.
        evidenceSets:
          - facts:
              - entity: Shipment:$shipment
                field: destination
                equals: City:$city
              - entity: City:$city
                field: country
                equals: Country:$country
              - entity: Country:$country
                field: currency
                equals: Currency:XOF
          - facts:
              - entity: Shipment:$shipment
                field: destination
                equals: City:$city
              - entity: City:$city
                field: country
                equals: Country:$country
              - entity: Currency:XOF
                field: countries
                includes: Country:$country

    resolved: |
      Deduction accepted. Dakar customs has the crate on the bench.

    referenceSolution: |
      query {
        city(name: "Genoa") {
          departingShipments {
            id
            manifest
            destination {
              name
              country {
                name
                currency {
                  code
                  name
                }
              }
            }
          }
        }
      }
