id: guest-register
title: The Guest Register
campaign: shadow-network
order: 3
clearance: 2
kind: teaching
teaches: arguments
practises: [nested-selections]
requires: [nested-selections]
summary: >
  The crate's signer has left Luanda. Three hotels think they have seen
  the same guest.
motif: register
clock:
  countdown: NIGHTJAR's contact leaves in {remaining}
  expired: NIGHTJAR's contact has left
  onExpiry: end
startingStage: luanda

debrief:
  onTime: |
    The registry adds a line to MARBLE_HERON's file: dined with
    NIGHTJAR, Zanzibar City. The clerk underlines the soup.
  stampOnTime: IDENTIFIED
  comparison: >
    In Luanda, the reference solution gives `operative` a codename as its
    [argument](glossary:argument): `operative(codename: "NIGHTJAR")`. The argument picks one
    record out of the registry, so the result holds one file and not
    the whole registry. In Zanzibar City, the reference solution gives `city` an argument
    instead: `city(name: "Zanzibar City")`. The city's sightings include
    the dinner, and inside that sighting the reference solution opens the
    cover name the guest gave and the operative it is filed under. You
    could also look up each cover name in its own transmission, first
    `coverName(name: "Dr. Lund")` and then `coverName(name: "D. Lund")`.
    The argument has to match the name exactly, title and full stop
    included, so the two lookups return two different records. Dr. Lund
    is filed under MARBLE_HERON and was given in Zanzibar City. D. Lund
    is filed under TIN_FALCON and was given nowhere at all.
  geography: >
    Swahili is an official language of Tanzania and Kenya. Mozambique,
    just to the south, has Portuguese as its official language.

stages:
  luanda:
    location: AO
    introduces: ruling-out
    objective: Identify the sighting that is NIGHTJAR and the country it was in.

    briefing: |
      NIGHTJAR signed order LUA-012 and left Luanda the same
      night, to meet somebody the registry would like to identify.
      Three hotels have each filed a sighting under the codename:
      one in Mombasa, one in Zanzibar City, and one in Maputo. The
      case board lists the three sightings, and the map shows where
      each city is and how long the journey there would take. Only
      one of the hotels saw NIGHTJAR, and your travel order goes to
      that city.

      The registry holds a great many files, and the clerk asks
      that you request the one you need.

      Two of the three sightings are of somebody else, and in this
      case you can strike them off. Choose a sighting on the form and
      press Rule out. The archive then looks through your responses
      for a fact that contradicts one of the claims about that
      sighting. If it finds one, the sighting is ruled out, and the
      form shows the facts that contradict the claim. Ruling out a
      sighting costs no time.

      The sighting shows which name the guest gave. NIGHTJAR's file
      lists the operative's cover names. The archive can tell that a
      name is missing from the list only if your response holds the
      complete list of cover names.

    clues:
      - text: >
          All three sightings were filed under NIGHTJAR.
        constraint:
          $sighting.operative: Operative:NIGHTJAR
      - text: >
          NIGHTJAR travels under cover names. A true sighting gives a
          name that is in NIGHTJAR's own file.
        constraint:
          $sighting.nameGiven: $sighting.operative.coverNames
      - text: >
          A porter overheard the guest bargaining in Swahili, in a
          country where it is spoken.
        constraint:
          $sighting.city.country.languages: Language:swahili
          $sighting.city.country: $country

    scaffold:
      level: guided
      starterQuery: |
        query {
          operative(codename: "") {
            # Whose file? Write the codename between the quotes.
            codename
            # Which names does this operative travel under,
            # and where has the operative been seen?
          }
        }

    hints:
      nudge: >
        One sighting gives a name from NIGHTJAR's file and is in a
        country where Swahili is spoken. The other two each fail one of
        those two tests.
      concept: >
        The registry holds many operatives, so the operative field has
        to be told which one you want. You tell it with an argument, in
        parentheses after the field. The starter query already has the
        argument, with empty quotes. Write the codename between the quotes.
      schema: >
        Look at Operative.coverNames, Operative.sightings,
        Sighting.nameGiven, Sighting.city, and Country.languages.
      skeleton: |
        operative(codename: "NIGHTJAR") {
          coverNames { name }
          sightings { id nameGiven { name } city { name country { name languages { name } } } }
        }

    solution:
      type: destination
      sighting: SGT-031
      country: TZ
    labels:
      sighting: Sighting
      country: Country of the sighting

    claims:
      - id: name
        prompt: The name the guest gave is one of NIGHTJAR's cover names.
        evidenceSets:
          - facts:
              - entity: Sighting:$sighting
                field: nameGiven
                equals: CoverName:$name
              - entity: Operative:NIGHTJAR
                field: coverNames
                includes: CoverName:$name
          - facts:
              - entity: Sighting:$sighting
                field: nameGiven
                equals: CoverName:$name
              - entity: CoverName:$name
                field: operative
                equals: Operative:NIGHTJAR
      - id: language
        prompt: The sighting was in a country where Swahili is spoken.
        evidenceSets:
          - facts:
              - entity: Sighting:$sighting
                field: city
                equals: City:$city
              - entity: City:$city
                field: country
                equals: Country:$country
              - entity: Country:$country
                field: languages
                includes: Language:swahili
          - facts:
              - entity: Sighting:$sighting
                field: city
                equals: City:$city
              - entity: City:$city
                field: country
                equals: Country:$country
              - entity: Language:swahili
                field: countries
                includes: Country:$country

    leads:
      SGT-027:
        label: The Mombasa sighting
        city: mombasa
      SGT-031:
        label: The Zanzibar City sighting
        city: zanzibar-city
      SGT-034:
        label: The Maputo sighting
        city: maputo

    leadOutcomes:
      SGT-027:
        location: KE
        refutation:
          claim: name
          facts:
            - entity: Sighting:$sighting
              field: nameGiven
              equals: CoverName:$name
            - entity: Operative:NIGHTJAR
              field: coverNames
              excludes: CoverName:$name
        ruledOut: |
          Mombasa's guest signed as H. Brandt, a name that is not in
          NIGHTJAR's file. The registry files it under COPPER_KITE, who
          is entitled to a holiday.
      SGT-034:
        location: MZ
        refutation:
          claim: language
          facts:
            - entity: Sighting:$sighting
              field: city
              equals: City:$city
            - entity: City:$city
              field: country
              equals: Country:$country
            - entity: Country:$country
              field: languages
              excludes: Language:swahili
        ruledOut: |
          Maputo's guest gave the right name. The post office adds
          that nobody there bargains in Swahili, least of all the porter.

    resolved: |
      Travel order approved. The ferry comes into the harbour of
      Zanzibar City past a line of wooden sailing boats, and the old
      town rises behind the quay in white stone and carved wooden
      doors. The hotel produces its register and a pot of tea.
      Somebody in this town came to meet NIGHTJAR, and the register
      may say who.

    referenceSolution: |
      query {
        operative(codename: "NIGHTJAR") {
          coverNames {
            name
          }
          sightings {
            id
            nameGiven {
              name
            }
            city {
              name
              country {
                name
                languages {
                  name
                }
              }
            }
          }
        }
      }

    next: zanzibar

  zanzibar:
    location: TZ
    objective: Identify the operative who dined with NIGHTJAR.

    briefing: |
      The register shows that M. Calloway, the cover name NIGHTJAR
      used here, dined with a guest called Lund. Tea has been spilt
      across the page, and the clerk cannot tell whether the guest
      signed as Dr. Lund or as D. Lund. The registry keeps both cover
      names and files each one under a different operative. The case
      board lists both of them.

      The hotel reported the dinner to the archive as a sighting in
      Zanzibar City, and a sighting records the name the guest gave.
      Find out which cover name the guest gave, and which
      operative the registry files that name under.

    clues:
      - text: >
          The cover name is the one the guest gave in the hotel's sighting.
          That sighting is in Zanzibar City, and its note says that the
          guest dined with M. Calloway.
        constraint:
          $sighting.city: City:zanzibar-city
          $sighting.note: Dined with M. Calloway. Signed the register after the soup.
          $sighting.nameGiven: $name
      - text: >
          The registry files each cover name under one operative.
        constraint:
          $operative.coverNames: $name

    scaffold:
      level: partial
      starterQuery: |
        query {
          coverName(name: "") {
            # Write one of the two cover names between the quotes.
            # Which operative uses that cover name, and did a guest
            # in Zanzibar City give it?
          }
        }

    hints:
      nudge: >
        Only one of the two cover names was given by a guest in Zanzibar
        City. Find that one, and then find which operative the registry
        files it under.
      concept: >
        The coverName field has an argument that says which cover name
        you want. Dr. Lund and D. Lund are two different arguments, and
        each one returns a different record. You can look up one cover
        name in each transmission. You can also give the city field the
        argument Zanzibar City and look through the city's sightings.
      schema: >
        Look at City.sightings, Sighting.note, Sighting.nameGiven,
        CoverName.sightings, and CoverName.operative.
      skeleton: |
        city(name: "Zanzibar City") {
          sightings { id note nameGiven { name operative { codename } } }
        }

    solution:
      type: deduction
      name: dr-lund
      operative: MARBLE_HERON
    labels:
      name: Name in the register
      operative: Filed under

    claims:
      - id: seen
        prompt: A guest in Zanzibar City gave this name.
        evidenceSets:
          - facts:
              - entity: City:zanzibar-city
                field: sightings
                includes: Sighting:$sighting
              - entity: Sighting:$sighting
                field: nameGiven
                equals: CoverName:$name
          - facts:
              - entity: CoverName:$name
                field: sightings
                includes: Sighting:$sighting
              - entity: Sighting:$sighting
                field: city
                equals: City:zanzibar-city
          - facts:
              - entity: Sighting:$sighting
                field: city
                equals: City:zanzibar-city
              - entity: Sighting:$sighting
                field: nameGiven
                equals: CoverName:$name
      - id: owner
        prompt: The registry files this name under this operative.
        evidenceSets:
          - facts:
              - entity: CoverName:$name
                field: operative
                equals: Operative:$operative
          - facts:
              - entity: Operative:$operative
                field: coverNames
                includes: CoverName:$name

    leads:
      dr-lund:
        label: Dr. Lund
      d-lund:
        label: D. Lund

    leadOutcomes:
      d-lund:
        refutation:
          claim: seen
          facts:
            - entity: CoverName:$name
              field: sightings
              excludes: Sighting:SGT-040
        ruledOut: |
          TIN_FALCON signs as D. Lund and has never claimed a
          doctorate. No sighting in the register gives that name.

    resolved: |
      Deduction accepted. NIGHTJAR came to Zanzibar City to dine with
      MARBLE_HERON, and the registry notes the dinner in both files.

    referenceSolution: |
      query {
        city(name: "Zanzibar City") {
          sightings {
            id
            note
            nameGiven {
              name
              operative {
                codename
              }
            }
          }
        }
      }
