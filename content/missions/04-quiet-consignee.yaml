id: quiet-consignee
title: The Quiet Consignee
campaign: shadow-network
order: 4
clearance: 2
kind: assessment
teaches: null
practises: [nested-selections, arguments]
requires: [nested-selections, arguments]
summary: >
  Customs in Callao is holding six cases of printing plates. Two companies
  with nearly the same name have an interest.
motif: plate
clock:
  countdown: Customs releases the cases in {remaining}
  expired: Customs has released the cases
  onExpiry: end
startingStage: callao

debrief:
  onTime: |
    Callao customs keeps the plates and sends for PEWTER_SWIFT,
    who arrives with a receipt for something else entirely.
  stampOnTime: HELD
  comparison: >
    The reference solution asks for one shipment, with the shipment's
    identifier as the argument. Inside the shipment it opens both
    companies, and inside each company it opens the director. That is one
    argument, three levels of braces, and one transmission.
  geography: >
    Callao is the port of Lima, on Peru's Pacific coast. Valparaíso,
    where the cases were loaded, is Chile's main port on the same coast.

stages:
  callao:
    location: PE
    introduces: field-check
    objective: Identify the company that is to receive VAL-0733 and the operative who directs that company.

    briefing: |
      Customs in Callao has held shipment VAL-0733. Two companies
      called Meridian appear on its papers, one at each end of the
      voyage. The bureaucracy wants the receiving company and its
      director, and has asked not to be given the sender by mistake.

      This case adds the field check. Suppose you have supported
      one claim about a lead and cannot yet support the other. The
      form then offers to order a field check. The office in that
      lead's country looks into the lead and sends back a dispatch
      that says where to look next. A field check costs hours, and
      the button shows how many before you press it. The case
      stays open afterwards.

    clues:
      - text: >
          Customs wants the party that is to receive VAL-0733, not the
          party that sent it.
        constraint:
          $company.shipments: Shipment:VAL-0733
      - text: >
          The person to identify is that company's director.
        constraint:
          $company.director: $operative

    scaffold:
      level: none

    hints:
      nudge: >
        The shipment's papers give a shipper and a consignee. Only one
        of the two is receiving the cases.
      concept: >
        Ask for the one shipment by giving its identifier as an argument,
        in parentheses. Inside the shipment's braces, open each company.
        Inside each company, open its director.
      schema: >
        Look at Shipment.shipper, Shipment.consignee, and
        Company.director.
      skeleton: |
        shipment(id: "VAL-0733") { shipper { name } consignee { name director { codename } } }

    solution:
      type: deduction
      company: PE-MERIDIAN-FRT
      operative: PEWTER_SWIFT
    labels:
      company: Receiving company
      operative: Director

    claims:
      - id: consignee
        prompt: This company is to receive VAL-0733.
        evidenceSets:
          - facts:
              - entity: Shipment:VAL-0733
                field: consignee
                equals: Company:$company
          - facts:
              - entity: Company:$company
                field: shipments
                includes: Shipment:VAL-0733
      - id: director
        prompt: This operative directs the company.
        evidenceSets:
          - facts:
              - entity: Company:$company
                field: director
                equals: Operative:$operative
          - facts:
              - entity: Operative:$operative
                field: directorships
                includes: Company:$company

    leadOutcomes:
      CL-MERIDIAN-FWD:
        location: CL
        refutation:
          claim: consignee
          facts:
            - entity: Shipment:VAL-0733
              field: shipper
              equals: Company:$company
        ruledOut: |
          Meridian Forwarding sent the cases. Valparaíso observes
          that a company seldom posts things to itself.
        fieldCheck: |
          Valparaíso confirms who directs Meridian Forwarding. The
          shipping clerk asks which end of the voyage customs meant.

    resolved: |
      Deduction accepted. Customs keeps the cases.

    referenceSolution: |
      query {
        shipment(id: "VAL-0733") {
          shipper {
            name
            director {
              codename
            }
          }
          consignee {
            name
            director {
              codename
            }
          }
        }
      }
