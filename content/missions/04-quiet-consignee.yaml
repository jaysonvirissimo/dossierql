id: quiet-consignee
title: The Quiet Consignee
campaign: shadow-network
order: 4
clearance: 2
kind: assessment
teaches: null
practises: [nested-selections, arguments]
requires: [nested-selections, arguments]
summary: >
  Customs in Callao is holding six cases of printing plates. The papers
  leave the consignee blank, and two companies with nearly the same name
  have asked after them.
motif: plate
clock:
  countdown: Customs releases the cases in {remaining}
  expired: Customs has released the cases
  onExpiry: end
startingStage: callao

debrief:
  onTime: |
    Callao customs keeps the plates and sends for PEWTER_SWIFT,
    who arrives with a receipt for something else entirely.
  stampOnTime: HELD
  comparison: >
    The shipping papers for VAL-0733 give a shipper and leave the
    consignee empty. A query that asks for the shipment's `consignee`
    therefore gets nothing back. The reference solution does not ask for
    it. It asks for one shipment, with the shipment's identifier as the
    argument. Inside the shipment it opens the shipper and the shipper's
    director. They show that Meridian Forwarding sent the cases, and
    that its director, UMBER_SKUA, is not the operative to identify. It
    also opens `intake`, the record the depot in Callao wrote when the
    cases came ashore. Inside the intake record it opens the consignee,
    Meridian Freight, and inside the company it opens the director.
    That is one argument and one transmission. A field check on
    Meridian Freight points to the same intake record, for two hours.
  geography: >
    Callao is the port of Lima, on Peru's Pacific coast. Valparaíso,
    where the cases were loaded, is Chile's main port on the same coast.

stages:
  callao:
    location: PE
    introduces: field-check
    objective: Identify the company that is to receive VAL-0733 and the operative who directs that company.

    briefing: |
      Customs in Callao has held shipment VAL-0733. The shipping
      papers give the sender and leave the consignee blank. Two
      companies have asked customs about the cases: Meridian
      Forwarding and Meridian Freight. The bureaucracy wants the
      receiving company and its director, and has asked not to be
      given the sender by mistake.

      This case adds the field check. You may find who directs a
      company before you find any record that shows the company is
      to receive the cases. Choose that company on the form, choose
      its director in the Director box, and submit the deduction.
      The archive returns the deduction if your responses prove one
      claim and not the other. The returned form then offers Order a
      field check. The office in that company's country looks into
      the company and sends back a dispatch. The dispatch says which
      record to look at next. The button shows how many hours the
      check costs. The case stays open afterwards, with your choices
      on the form kept.

    clues:
      - text: >
          Customs wants the party that is to receive VAL-0733, not the
          party that sent it.
        constraint:
          $intake: IntakeRecord:INT-CAL-0733
          $intake.consignee: $company
      - text: >
          The person to identify is that company's director.
        constraint:
          $company.director: $operative

    scaffold:
      level: none

    hints:
      nudge: >
        The shipping papers leave the consignee blank. The depot in
        Callao kept its own record of the cases when they came ashore,
        and that record says who is to receive them.
      concept: >
        Ask for the one shipment by giving its identifier as an argument,
        in parentheses. Inside the shipment's braces, open the depot's
        intake record. Inside the intake record, open the consignee, and
        inside the consignee, open its director.
      schema: >
        Look at Shipment.intake, IntakeRecord.consignee, and
        Company.director.
      skeleton: |
        shipment(id: "VAL-0733") { shipper { name } intake { consignee { name director { codename } } } }

    solution:
      type: deduction
      company: PE-MERIDIAN-FRT
      operative: PEWTER_SWIFT
    labels:
      company: Receiving company
      operative: Director

    claims:
      - id: consignee
        prompt: This company is to receive VAL-0733.
        evidenceSets:
          - facts:
              - entity: Shipment:VAL-0733
                field: intake
                equals: IntakeRecord:$intake
              - entity: IntakeRecord:$intake
                field: consignee
                equals: Company:$company
          - facts:
              - entity: Shipment:VAL-0733
                field: unloadingReceipt
                equals: UnloadingReceipt:$receipt
              - entity: UnloadingReceipt:$receipt
                field: labelConsignee
                equals: Company:$company
      - id: director
        prompt: This operative directs the company.
        evidenceSets:
          - facts:
              - entity: Company:$company
                field: director
                equals: Operative:$operative
          - facts:
              - entity: Operative:$operative
                field: directorships
                includes: Company:$company

    leadOutcomes:
      CL-MERIDIAN-FWD:
        location: CL
        refutation:
          claim: consignee
          facts:
            - entity: Shipment:VAL-0733
              field: shipper
              equals: Company:$company
        ruledOut: |
          Meridian Forwarding sent the cases. Valparaíso observes
          that a company seldom posts things to itself.
        fieldCheck: |
          Valparaíso confirms who directs Meridian Forwarding. The
          shipping clerk adds that the company is on the papers
          already, as the shipper, and asks which end of the voyage
          customs meant.
      PE-MERIDIAN-FRT:
        location: PE
        fieldCheck: |
          Callao confirms that a clerk from Meridian Freight has been
          at the quay twice, asking after six cases. The depot wrote
          the cases up when they came ashore, and its intake record
          for VAL-0733 says who is to receive them.

    resolved: |
      Deduction accepted. Customs keeps the cases.

    referenceSolution: |
      query {
        shipment(id: "VAL-0733") {
          shipper {
            name
            director {
              codename
            }
          }
          intake {
            consignee {
              name
              director {
                codename
              }
            }
          }
        }
      }
