Endorsement:
  END-0301:
    reference: END-0301
    remark: Away in Luanda until the end of the week. The room stays locked until I am back.
    officer: joaquim-teles
  END-0302:
    reference: END-0302
    remark: The inner room lent for the afternoon, as the standing instruction for the room requires.
    officer: duarte-sequeira
  END-0303:
    reference: END-0303
    remark: Key of the inner room drawn from the private office's safe, for the afternoon.
    officer: duarte-sequeira
  END-0304:
    reference: END-0304
    remark: Sent down the stair on an errand for the private office.
    officer: henrique-lobo
  END-0401:
    reference: END-0401
    remark: Brought by hand, to be kept in the private office and not entered in the First Desk's register.
    officer: teresa-valente
  END-0402:
    reference: END-0402
    remark: Received from the officer who brought it, and filed. Not shown to the head of the First Desk.
    officer: duarte-sequeira
  END-0403:
    reference: END-0403
    remark: Brought by hand, with the instruction for the inner room.
    officer: teresa-valente
  END-0404:
    reference: END-0404
    remark: Filed.
    officer: duarte-sequeira
  END-0405:
    reference: END-0405
    remark: Brought by hand, with the instruction for the inner room. To be shown to nobody at the Cipher Room.
    officer: teresa-valente
  END-0406:
    reference: END-0406
    remark: Filed.
    officer: duarte-sequeira
  END-0501:
    reference: END-0501
    remark: I received the visitor in the inner room at five, and opened the door to him myself.
    officer: teresa-valente
  END-0502:
    reference: END-0502
    remark: Took the visitor to the door of the inner room, and waited in the private office until he was brought out.
    officer: duarte-sequeira
  END-0503:
    reference: END-0503
    remark: Key of the inner room received from the private secretary, and handed back at half past five.
    officer: teresa-valente
  END-0601:
    reference: END-0601
    remark: Taken in at the counter and kept in the counter's safe until it was called for.
    officer: benedita-rocha
  END-0602:
    reference: END-0602
    remark: Called for, and signed out of the counter's safe, for the chair of the Standing Committee.
    officer: rui-fontes
  END-0603:
    reference: END-0603
    remark: Received the envelope at the counter, and carried it to the Committee's rooms unopened.
    officer: rui-fontes
