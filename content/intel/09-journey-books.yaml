# Records for clearance 11: journey books, and the accounts office's
# vouchers for the fares in them (SDD 3.7). A voucher is reached only
# through the receipt for an expense claim, so the inquiry reads the
# accounts office's books by filing claims. LJB-0112 is the journey book of
# the messengers' room in Lisbon, MDB-0112 the drivers' book of Madrid
# Station for the same evening, and MDB-0113 the drivers' book for the day
# after.
