# Records for clearance 12: the pursuit of GILT_MAGPIE from Lisbon to
# Trieste, and of the courier COPPER_STARLING from Trieste to Vienna (SDD
# 3.4). Premises are on the police list, and a Find is reached only through
# the receipt for a search warrant, so the inquiry reads what the police
# found by applying for searches. Each find that sends the pursuit on is a
# fact about the next place: a currency, a language, or a city whose country
# borders another.
Operative:
  GILT_MAGPIE:
    coverNames: [the-registrar, e-corvo]
    habit: Buys the newspaper of the next place he means to go, the day before he goes, and leaves it behind unread.
    weakness: Tips in the money of the next country on his journey, because he always changes his money a day early.
  COPPER_STARLING:
    codename: COPPER_STARLING
    coverNames: [l-weiss]
    organization: parallax-circle
    lastKnownLocation: trieste
    habit: Carries a guidebook to every city he visits, and has never been seen to open one.
    weakness: Cannot pass a bookshop.
  BRASS_PIPIT:
    habit: Reserves two tables in every restaurant, and eats at neither.
    weakness: Hums when he is lying.
  IRON_FINCH:
    habit: Sets his watch by every railway clock he passes.
    weakness: Cannot leave a hotel without complaining about the pillows.
CoverName:
  e-corvo: { name: E. Corvo }
  l-weiss: { name: L. Weiss }
  m-abreu: { name: M. Abreu }
  c-ruiz: { name: C. Ruiz }
Company:
  adriatic-line:
    name: Adriatic Line
    registeredIn: IT
Premises:
  # Lisbon: GILT_MAGPIE's room the night before he left.
  PRM-1201:
    reference: PRM-1201
    name: Pensão Flor de Lis
    kind: Boarding house
    city: lisbon
    witness: The guest in room 4 left before breakfast. He paid in escudos and tipped the maid in something else.
    statementRequired: false
    watched: false
  # Tangier: the magistrate wants the porter quoted word for word.
  PRM-1211:
    reference: PRM-1211
    name: Hotel Atlas Marina
    kind: Hotel
    city: tangier
    witness: 'Mr Corvo paid his bill and said, "Keep the change, I shan''t need it where I''m going." Then he asked me the time of the evening boat.'
    statementRequired: true
    watched: false
  # Valletta: three premises, and only the shipping office was watched.
  PRM-1221:
    reference: PRM-1221
    name: Harbour Hotel
    kind: Hotel
    city: valletta
    witness: Mr Corvo kept his room until noon and left his luggage tickets on the dressing table.
    statementRequired: false
    watched: false
  PRM-1222:
    reference: PRM-1222
    name: Café Kalkara
    kind: Café
    city: valletta
    witness: He drank one coffee and read nothing.
    statementRequired: false
    watched: false
  PRM-1223:
    reference: PRM-1223
    name: Shipping office of the Adriatic Line
    kind: Office
    city: valletta
    witness: The gentleman booked a berth on the night steamer and asked how far the quay is from the frontier.
    statementRequired: false
    watched: true
  # Trieste: the courier's room, and the bookshop below it.
  PRM-1251:
    reference: PRM-1251
    name: Pensione Miramare
    kind: Boarding house
    city: trieste
    witness: 'Signor Weiss said, "I have a letter to leave for a friend at the Albergo Duino." He left the letter at noon and did not come back for his bag.'
    statementRequired: true
    watched: false
  PRM-1252:
    reference: PRM-1252
    name: Libreria del Molo
    kind: Bookshop
    city: trieste
    witness: He bought a guidebook and asked whether he would need to change his money where he was going. I told him he would not.
    statementRequired: false
    watched: true
