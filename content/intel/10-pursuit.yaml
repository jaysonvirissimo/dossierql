  FND-1252:
    reference: FND-1252
    description: The bookshop's copy of a receipt for a guidebook to Vienna, sold to L. Weiss, with a railway timetable folded inside it.
    foundAt: PRM-1252
    leftBy: l-weiss
    city: vienna
Sighting:
  SGT-1241:
    city: trieste
    operative: GILT_MAGPIE
    nameGiven: e-corvo
    note: Came ashore from the night steamer from Valletta and took a room at the Albergo Duino. Asked the porter for the time of the evening train to Ljubljana.
  SGT-1242:
    city: trieste
    operative: BRASS_PIPIT
    nameGiven: herr-frick
    note: Came ashore from the night steamer from Valletta and reserved two tables for dinner on the waterfront.
  SGT-1261:
    city: vienna
    operative: COPPER_STARLING
    nameGiven: l-weiss
    note: Arrived on the overnight train from Trieste and asked the porter at the Westbahnhof for the next train to Prague.
  SGT-1262:
    city: vienna
    operative: IRON_FINCH
    nameGiven: j-novak
    note: Set his watch by the clock of the Südbahnhof and took a room near the station.
