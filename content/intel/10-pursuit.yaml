    leftBy: e-corvo
    currency: MAD
  FND-1202:
    reference: FND-1202
    description: Tunisian dinars in an envelope at the desk, left by the guest of room 6 for her sister.
    foundAt: PRM-1201
    leftBy: m-abreu
    currency: TND
  FND-1211:
    reference: FND-1211
    description: A newspaper in Maltese, folded on the bed of room 12. Nobody had opened it.
    foundAt: PRM-1211
    leftBy: e-corvo
    language: maltese
  FND-1212:
    reference: FND-1212
    description: A newspaper in Spanish, left in the lounge by the guest of room 3.
    foundAt: PRM-1211
    leftBy: c-ruiz
    language: spanish
  FND-1221:
    reference: FND-1221
    description: A ticket for the steamer to Marseille, bought in the name of E. Corvo and never used.
    foundAt: PRM-1221
    leftBy: e-corvo
    city: marseille
  FND-1222:
    reference: FND-1222
    description: A coffee cup, cold, and a saucer with two euro coins of Malta under it.
    foundAt: PRM-1222
    leftBy: e-corvo
    currency: EUR
  FND-1223:
    reference: FND-1223
    description: The counterfoil of a berth on the night steamer to Trieste, booked by the Adriatic Line for E. Corvo. On the back the clerk wrote the distance from the quay to the frontier.
    foundAt: PRM-1223
    leftBy: e-corvo
    city: trieste
  FND-1251:
    reference: FND-1251
