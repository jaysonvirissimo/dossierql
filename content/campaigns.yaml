- id: shadow-network
  title: The Shadow Network
  summary: >
    A crate of stolen tiles leads to a circle of couriers, front companies,
    and a correspondent who signs with a single initial.
- id: fourth-desk
  title: The Fourth Desk
  summary: >
    The desk that let the museum's tiles go kept a cabinet of its own,
    outside the agency's registry. The cabinet is under seal, and you are
    to read it.
