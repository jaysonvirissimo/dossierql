# Every term the game uses. `clearance` is the level at which mission text
# may first use the term; `matches` lists other spellings to look for.
# A definition may use only terms from its own clearance or below.
- id: query
  term: query
  clearance: 1
  matches: [queries]
  definition: >
    A request for information from the archive. You write the fields you
    want, in the shape you want them back, and the archive fills in the
    values. A query begins with the word `query` and a pair of braces. You
    can ask for more than one thing directly inside those braces. You may
    leave out the word `query` and start the request with its outer brace.
- id: transmission
  term: transmission
  clearance: 1
  matches: [transmissions]
  definition: >
    One query sent to the archive. On a case with a clock, each
    transmission costs one hour, however much it asks for. Asking for
    everything you need in one transmission is therefore cheaper than asking
    for it in several.
- id: field
  term: field
  clearance: 1
  matches: [fields]
  definition: >
    One piece of information in a record, such as a shipment's `manifest`.
    Every field has a name, and you ask for a field by writing its name in
    a query.
- id: selection
  term: selection
  clearance: 1
  matches: [selections, selection set]
  definition: >
    The fields you list between one pair of braces. When a field holds a
    record, such as a shipment's `destination`, you must write a selection
    after it to say which of that record's fields you want:
    `destination { name }`.
- id: nested-selection
  term: nested selection
  clearance: 1
  matches: [nested selections, nesting, nested]
  definition: >
    A selection inside another selection, as in
    `destination { country { name } }`. Nesting lets one query follow the
    links between records: from a shipment, to its destination city, to
    that city's country.
- id: type
  term: type
  clearance: 1
  matches: [types]
  definition: >
    A kind of record, such as `Shipment` or `Country`. Every record of one
    type has the same fields. The documentation panel lists the fields of
    each type.
- id: schema
  term: schema
  clearance: 1
  definition: >
    The full list of the archive's types and their fields. A query can ask
    only for what is in the schema. The documentation panel shows the
    schema.
- id: result
  term: result
  clearance: 1
  matches: [results, response]
  definition: >
    What the archive sends back for a query. A result holds data in the
    same shape as the query, with the fields in the order you asked for
    them. If the archive could not answer part of the query, the result
    also holds a list of errors.
- id: evidence
  term: evidence
  clearance: 1
  definition: >
    A fact that one of your queries returned. When you submit a travel
    order or a deduction, the archive looks for evidence among the facts
    you have retrieved, and only among those.
- id: evidence-chain
  term: evidence chain
  clearance: 1
  matches: [evidence chains]
  definition: >
    The facts that prove a claim about a record, each one leading to the
    next. For a shipment going to a country with no land border, the chain
    runs from the shipment to the city it is going to, from that city to its
    country, and from that country to the list of its borders. When the
    archive accepts a form, it shows the chain for each claim and the
    transmission each fact came back in.
- id: argument
  term: argument
  clearance: 2
  matches: [arguments]
  definition: >
    A value you give to a field, in parentheses after the field, as in
    `operative(codename: "NIGHTJAR")`. Here the argument is `codename`, and
    it tells `operative` which record you want. Put text and identifiers in
    double quotes. The documentation lists the arguments that each field
    accepts.
- id: alias
  term: alias
  clearance: 3
  matches: [aliases]
  definition: >
    A name you choose for a field's result. You write it before the field,
    followed by a colon, as in `first: operative(codename: "NIGHTJAR")`.
    The result then comes back as `first` instead of `operative`. With
    aliases, one query can ask for the same field twice with different
    arguments, because each result comes back under its own alias.
- id: fragment
  term: fragment
  clearance: 4
  matches: [fragments, fragment spread]
  definition: >
    A selection that you write once, give a name, and reuse. You define a
    fragment after the query's closing brace, as
    `fragment Dossier on Operative { codename }`. Here `Dossier` is the
    name you chose, and `Operative` is the type of record the fields belong
    to. To use the fragment, write three dots and its name, `...Dossier`,
    in any place where the query opens a record of the type `Operative`.
    Writing the three dots is called spreading the fragment. One fragment
    may spread another, but a fragment may never spread itself. A fragment
    therefore cannot follow a chain of records, such as an operative's
    associates and their associates, on its own. The query opens each level
    of the chain, and you spread the fragment inside each level:
    `knownAssociates { ...Dossier knownAssociates { ...Dossier } }`.
- id: variable
  term: variable
  clearance: 5
  matches: [variables]
  definition: >
    A value that you leave out of the query and supply separately. A
    variable's name starts with `$`. You declare the variable, with its
    type, in parentheses after the operation's name:
    `query Departures($city: String!)`. You then write the variable where
    the value would go: `city(name: $city)`. You type the value in the
    variables panel as JSON, such as `{ "city": "Lisbon" }`. The variable's
    type must be the type that the documentation shows for the argument it
    fills, which here is the `name` argument of `city`. To ask about
    another city, you change the value and leave the query as it is.
- id: operation
  term: operation
  clearance: 5
  matches: [operations, operation name]
  definition: >
    One whole request, from the word `query` to its closing brace. You can
    give an operation a name, as in `query Departures`, and a list of the
    variables it accepts.
- id: partial-result
  term: partial result
  clearance: 3
  matches: [partial results]
  definition: >
    A result that holds both data and errors. A field that the archive
    could not answer comes back as `null`, with an error that says why. The
    rest of the data is still good.
- id: introspection
  term: introspection
  clearance: 6
  matches: [introspect, introspecting]
  definition: >
    Asking the archive to describe itself. Every schema answers two special
    fields, which you write at the top level of a query, beside fields such
    as `city`. The first is `__schema`. The query
    `{ __schema { types { name fields { name } } } }` lists every type the
    archive holds, with the names of its fields. The second is `__type`.
    The query `{ __type(name: "Docket") { fields { name description } } }`
    describes one type, the type `Docket`, and gives the description of
    each of its fields. The names start with two underscores, so that they
    never clash with the archive's own fields. To find where a query can
    start, ask `__type(name: "Query")` for its `fields`. To learn what a
    field returns, ask for its `type`, and inside `type` for `kind` and
    `name`. A type with a `!` or a list around it has no name of its own:
    its `kind` is `NON_NULL` or `LIST`, and `ofType` holds the type
    inside, so ask for `ofType` again until a name comes back. Inside any
    record, `__typename` returns the name of the record's type.
    Introspection describes the archive and not its records, so its
    results hold no evidence and weigh nothing. Each introspection query
    is still a transmission.
- id: scalar
  term: scalar
  clearance: 6
  matches: [scalars]
  definition: >
    A type that holds a single value, such as `String`, `Int`, `Boolean`,
    or `ID`. A field whose type is a scalar takes no braces. An archive can
    define scalars of its own. Introspection gives such a scalar's `kind`
    as `SCALAR`, and the scalar's description says how its values are
    written.
- id: request-weight
  term: request weight
  clearance: 6
  matches: [weight]
  definition: >
    The number of records a request could return. The records clerk works
    it out before transmitting the request. A list counts for the most
    records it could hold, and a single value counts for nothing. A
    request that asks only about the archive itself, through
    introspection, weighs nothing. From
    clearance 6, every result states the weight of its request under
    `extensions`, beside `data`. From clearance 9, the clerk refuses a
    request that weighs more than 200, and returns it unsent at no cost.
- id: interface
  term: interface
  clearance: 7
  matches: [interfaces]
  definition: >
    A type that lists the fields several kinds of record share. In the
    Documentation tab, `Document` is an interface, and every document is a
    `Telegram`, a `Memorandum`, or a `Minute`. Each of those three types
    has every field that `Document` lists. A field that returns
    `Document`, such as `documents`, can return records of all three kinds
    in one list. Inside it, you ask for the fields that `Document` lists
    directly, and each one comes back for every record. For a field that
    only one kind has, you write an inline fragment. To learn which kind
    a record is, ask for `__typename`.
- id: inline-fragment
  term: inline fragment
  clearance: 7
  matches: [inline fragments]
  definition: >
    Three dots, the word `on`, a type's name, and braces with fields
    inside, as in `... on Telegram { text }`. You write it inside a field
    that returns an interface, beside the other fields you ask for. The
    fields inside the braces come back only for records of that type. A
    record of another type comes back without them, and with no error.
    An inline fragment is written where it is used, and it has no name of
    its own.
- id: union
  term: union
  clearance: 8
  matches: [unions]
  definition: >
    A type whose records are of several kinds, and the kinds need have no
    fields in common. In the Documentation tab, `Intercept` is a union.
    Each entry in an intercept log is a `Vessel`, a `Company`, a
    `Sighting`, a `Telegram`, or a `Pass`. An interface lists the fields
    that its kinds share, and a union lists no fields at all. So inside a
    field that returns a union, such as `entries`, you ask for every field
    inside an inline fragment for one kind, as in
    `... on Vessel { name }`. The one field you can ask for directly is
    `__typename`, which every type has, and which tells you the kind of
    each record.
- id: enum
  term: enum
  clearance: 8
  matches: [enums, enum value, enum values]
  definition: >
    A type whose values are a fixed list of words. `InterceptKind` is an
    enum, and its values are `VESSEL`, `COMPANY`, `SIGHTING`, `TELEGRAM`,
    and `PASS`. The Documentation tab lists the values of each enum. You
    write an enum value as the word itself, in capital letters and without
    quotation marks, as in `entries(kind: VESSEL)`. A word in quotation
    marks is text, and an argument that takes an enum refuses text. When
    the Documentation tab shows an argument's type in square brackets, as
    in `kinds: [InterceptKind!]`, the argument takes a list. You write a
    list as values between square brackets, with a comma between each
    value and the next, as in `kinds: [VESSEL, COMPANY]`. Where an
    argument takes a list, a single value is accepted as well, and the
    archive reads it as a list of one.
- id: pagination
  term: pagination
  clearance: 9
  matches: [page size, page sizes]
  definition: >
    Reading a long list one part at a time. Each part is a page. In the
    Documentation tab, the field `entries` on `WatchBook` returns a
    `WatchPage`, not a list. You write `entries(first: 10)` to ask for a
    page that holds the first ten entries. Inside the page, `nodes` lists
    the entries on it. The number after `first` is the page size. The
    records clerk weighs the request by the page size, not by the length
    of the whole book, so a page can come back when the whole book would
    be refused. To ask for the next page, you need a
    [cursor](glossary:cursor).
- id: cursor
  term: cursor
  clearance: 9
  matches: [cursors]
  definition: >
    A marker that says where a page ends, so that you can start the next
    page there. Inside a page, ask for `pageInfo { hasNextPage endCursor }`.
    `hasNextPage` is `true` when the list goes on after the page, and
    `endCursor` is the cursor of the last entry on the page. In a watch
    book, the cursor of an entry is its `reference`, such as `COR-0060`.
    You write `entries(first: 10, after: "COR-0060")` to ask for the ten
    entries that come after entry COR-0060.
- id: directive
  term: directive
  clearance: 10
  matches: [directives]
  definition: >
    An instruction written after `@` that changes how the archive treats
    part of a request. In `minuteSheet @include(if: $detail) { remark }`,
    the directive `@include` asks for the minute sheet only when the
    variable `$detail` is `true`. When `$detail` is `false`, the archive
    leaves `minuteSheet` out of the result, and the records clerk leaves
    it out of the request's weight. `@skip(if: $summary)` works the other
    way round: it leaves the field out when `$summary` is `true`. The
    value after `if` has the type `Boolean!`, so a variable that you write
    there must be declared as `Boolean!`, with the `!`.
- id: mutation
  term: mutation
  clearance: 11
  matches: [mutations, mutation field, mutation fields]
  definition: >
    A request that changes the archive, such as filing an expense claim.
    It is written like a query, and starts with the word `mutation`
    instead of `query`. Each field of a mutation files one form and
    returns the receipt for it, and you ask for the fields of the receipt
    in braces, as you ask for the fields of a record. In
    `mutation { fileExpenseClaim(journey: "JRN-0398", amount: 12) { status } }`,
    the archive files one claim and returns its status. When a mutation
    has several fields, the archive files them one at a time, in the order
    you wrote them. Two fields with the same name need an alias each.
- id: decimal-number
  term: decimal number
  clearance: 11
  matches: [decimal numbers, Float]
  definition: >
    A number with a point and digits after it, such as `412.5`. The type
    `Float` takes a decimal number or a whole number, so you can write
    `amount: 412.5` or `amount: 12`. Write the number without quotation
    marks: `"412.5"` is text, and the archive refuses text where a `Float`
    goes.
- id: input-object
  term: input object
  clearance: 12
  matches: [input objects, input type, input types]
  definition: >
    A form that an argument takes, with a box for each of its fields. You
    write it in braces, and each box inside the braces as its name, a
    colon, and a value, as in `input: { premises: "PRM-1201" }`. The
    braces hold values that you send to the archive, so you write a value
    after each box rather than braces of fields to ask for. The
    documentation panel lists the boxes of an input object as it lists
    the fields of a record type. A box with `!` must be filled, and a box
    with a default value may be left out. A box can hold an input object
    of its own, as in `subject: { operative: "GILT_MAGPIE" }`.
- id: block-string
  term: block string
  clearance: 12
  matches: [block strings]
  definition: >
    Text written between three quotation marks at each end, as in
    `"""He said "Keep the change" and left."""`. Inside a block string, a
    quotation mark is only a character, and the text may run over several
    lines. In an ordinary string, which has one quotation mark at each
    end, you write a quotation mark inside the text with a backslash in
    front of it, as in `"He said \"Keep the change\" and left."`.
- id: default-value
  term: default value
  clearance: 12
  matches: [default values]
  definition: >
    The value that a variable takes when the variables panel leaves the
    variable out. You write it after the variable's type, with an equals
    sign, as in `$urgency: Urgency = ROUTINE`. When the variables panel
    holds `{ "premises": "PRM-1221" }`, the variable `$urgency` is
    `ROUTINE`. When the panel holds `"urgency": "URGENT"` as well, the
    variable is `URGENT`. An argument or a box of an input object can have
    a default value too, and the documentation panel shows it after the
    type.
