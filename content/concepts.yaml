- id: nested-selections
  title: Fields and nested selections
  clearance: 1
  summary: >
    A query lists the fields you want. Some fields, such as a shipment's
    `destination`, hold another record instead of a single value. Write
    braces after a field of that kind, and ask for the fields you want from
    the record inside. The example opens `destination`, and then opens
    `country` inside it. Braces inside braces are a nested selection.
  example: |
    query {
      city(name: "Lisbon") {
        departingShipments {
          manifest
          destination { name country { name } }
        }
      }
    }
  payoff: >
    One nested query follows every link in a single transmission.
- id: arguments
  title: Arguments
  clearance: 2
  summary: >
    The registry holds many operatives, and `operative` returns only
    one of them. You say which one in parentheses after the field:
    `operative(codename: "NIGHTJAR")`. The part in parentheses is an
    argument. The documentation lists the arguments that each field accepts.
  example: |
    query {
      operative(codename: "NIGHTJAR") {
        coverNames { name }
      }
    }
  payoff: >
    You get the one file you asked for, out of the dozens the registry holds.
- id: aliases
  title: Aliases
  clearance: 3
  summary: >
    Ask for `operative` twice in one query and the two results collide,
    because both would come back as `operative`. Write a name of your own
    and a colon in front of each one, as in
    `first: operative(codename: "GREY_PETREL")`. Each result then comes
    back under the name you wrote. That name is an alias.
  example: |
    query {
      first: operative(codename: "GREY_PETREL") { codename }
      second: operative(codename: "SABLE_IBIS") { codename }
    }
  payoff: >
    Several files come back side by side in one transmission.
- id: fragments
  title: Fragments
  clearance: 4
  summary: >
    The example asks for the same two fields from an operative and from
    each of that operative's associates. Instead of writing the fields in
    both places, you write them once as a fragment:
    `fragment Dossier on Operative`, followed by the fields in braces.
    `Dossier` is a name you choose, and `Operative` is the type of record
    the fields belong to. Then write three dots and the fragment's name,
    `...Dossier`, in each place where the query opens an operative. Writing
    the three dots is called spreading the fragment.
  example: |
    query {
      operative(codename: "GREY_PETREL") {
        ...Dossier
        knownAssociates { ...Dossier }
      }
    }
    fragment Dossier on Operative {
      codename
      organization { name }
    }
  payoff: >
    Every dossier comes back with the same fields, and you change them all
    by editing one place.
- id: variables
  title: Variables
  clearance: 5
  summary: >
    A variable stands in for a value that changes from one transmission to
    the next. In the example, `$city` is a variable. You declare it, with
    its type, in parentheses after the operation's name: `($city: String!)`.
    You then write it where the value would go: `city(name: $city)`. You
    type the value itself in the variables panel below the editor, as JSON:
    `{ "city": "Lisbon" }`.
  example: |
    query Departures($city: String!) {
      city(name: $city) {
        departingShipments { id manifest }
      }
    }
  payoff: >
    To ask about the next city, you change the value and leave the query
    alone.
- id: introspection
  title: Introspection
  clearance: 6
  summary: >
    Introspection is asking the archive to describe itself. In the example,
    `__type(name: "Docket")` asks the archive to describe the type
    `Docket`. Inside it, `fields` gives each field's name, its description,
    and its type. A type with a `!` or a list around it has no name of its
    own: its `kind` is `NON_NULL` or `LIST`, and `ofType` holds the type
    inside. To list every type the archive holds, ask for
    `__schema { types { name } }` instead.
  example: |
    query {
      __type(name: "Docket") {
        fields {
          name
          description
          type { kind name ofType { kind name } }
        }
      }
    }
  payoff: >
    A part of the archive with no documentation still tells you what it
    holds, what each field means, and what each field returns.
- id: interfaces
  title: Interfaces and inline fragments
  clearance: 7
  summary: >
    An interface is a type that lists the fields several kinds of record
    share. In the example, `documents` returns the interface `Document`, so
    the list holds telegrams, memoranda, and minutes together. The fields
    `reference` and `stamp` belong to `Document`, so they come back for
    every document. The field `text` belongs only to `Telegram`, so the
    example asks for it inside `... on Telegram`, an inline fragment. The
    argument `city` on `documents` narrows the list to the documents filed
    in one city.
  example: |
    query {
      caseFile(reference: "CF-0417") {
        documents(city: "Lisbon") {
          __typename
          reference
          stamp
          ... on Telegram { text }
        }
      }
    }
  payoff: >
    One query reads a file of mixed papers, and asks each kind of paper for
    the fields that only that kind has.
- id: unions
  title: Unions and enums
  clearance: 8
  summary: >
    A union is a type that stands for several kinds of record and lists no
    fields of its own. In the example, `entries` returns the union
    `Intercept`, so the list holds vessels, companies, sightings,
    telegrams, and passes together. The example asks for `__typename`
    directly, because every type has it, and asks for every other field
    inside an inline fragment for one kind, such as `... on Vessel`. The
    argument `kinds` takes a list of values of the enum `InterceptKind`.
    An enum value is a word in capital letters, written without quotation
    marks, so `kinds: [VESSEL, SIGHTING]` lists only the vessels and the
    sightings.
  example: |
    query {
      interceptLog(reference: "IL-0112") {
        entries(kinds: [VESSEL, SIGHTING]) {
          __typename
          ... on Vessel { name report }
          ... on Sighting { note }
        }
      }
    }
  payoff: >
    One query reads a log of unrelated records, and asks each kind for its
    own fields.
- id: pagination
  title: Pagination
  clearance: 9
  summary: >
    A long list can come back one page at a time. In the example,
    `entries` returns one page of a watch book. The argument `first: 10`
    is the page size, so the page holds ten entries, and `nodes` lists
    them. The argument `after` starts the page after the entry whose
    cursor you give. Inside `pageInfo`, `hasNextPage` says whether the
    book goes on, and `endCursor` gives the cursor to start the next page
    after. The records clerk weighs the request by its page size, so a
    book too long to read whole can still be read, page by page.
  example: |
    query {
      watchBook(reference: "WB-0112") {
        entries(first: 10, after: "COR-0010") {
          nodes { reference hour note }
          pageInfo { hasNextPage endCursor }
        }
      }
    }
  payoff: >
    A list too heavy to release in one request is read in pages, each
    page starting where the one before it ended.
- id: directives
  title: Directives
  clearance: 10
  summary: >
    A request can carry a field that it asks for only some of the time.
    In the example, `@include(if: $detail)` after `minuteSheet` asks for
    the minute sheet only when the variable `$detail` is `true`. Send the
    request with `{ "detail": false }`, and the archive leaves the minute
    sheet out, and the records clerk does not count it in the request's
    weight. `@skip(if: $summary)` works the other way round: it leaves a
    field out when `$summary` is `true`. You can also write a directive
    after a fragment spread, or after three dots and no type, as in
    `... @include(if: $detail) { … }`, to leave out a group of fields at
    once.
  example: |
    query DayFile($first: Int, $after: String, $detail: Boolean!) {
      paperFile(reference: "DAY-0112") {
        papers(first: $first, after: $after) {
          nodes {
            reference
            subject
            minuteSheet @include(if: $detail) { remark officer { name } }
          }
        }
      }
    }
  payoff: >
    One operation reads a file quickly and then in full. You change a
    variable, and you leave the query as it is.
- id: mutations
  title: Mutations
  clearance: 11
  summary: >
    A mutation files paperwork with the archive. It starts with the word
    `mutation` instead of `query`, and each of its fields files one form.
    The field's arguments are the boxes of the form, and the field returns
    a receipt, whose fields you ask for in braces, as you ask for the
    fields of a record. In the example, one mutation files two expense
    claims. The field `fileExpenseClaim` appears twice, so each claim has
    an alias. The archive files the claims one at a time, in the order
    the mutation lists them.
  example: |
    mutation {
      outward: fileExpenseClaim(journey: "JRN-0403", amount: 8) {
        status
        voucher { remark countersignedBy { name } }
      }
      onward: fileExpenseClaim(journey: "JRN-0405", amount: 412.5) {
        status
        voucher { to { name } }
      }
    }
  payoff: >
    One transmission files several forms, and every receipt that comes
    back is evidence the archive can use.
