# Cities the game knows about. Hand-maintained: append new entries here and
# re-run `npm run world:build`; scripts/build-world.ts validates and sorts them.
#
#   id       lowercase kebab-case ASCII, unique
#   name     display name
#   country  ISO 3166-1 alpha-2 code of a country in data/world.json
#   lat/lon  decimal degrees (north and east positive), 2 decimals
#
# Hong Kong is filed under CN because the dataset holds sovereign states only.

